[package]
name = "bytes_rs"
version = "3.1.2"
edition = "2021"
authors = ["Antigravity Team"]
description = "Utility to parse a string bytes to bytes and vice-versa (Rust port)"
license = "MIT"

[lib]
name = "bytes_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi-bindings"]
napi-bindings = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "2.16", optional = true }
regex = "1.10"

[dev-dependencies]
proptest = "1.4"

[[bin]]
name = "bench_rust"
path = "bench/bench_rust.rs"

