[package]
name = "bytes_js"
version = "3.1.2"
edition = "2021"
description = "High-performance Rust port of visionmedia/bytes.js - Utility to parse string bytes to bytes and vice-versa"
license = "MIT"
repository = "https://github.com/visionmedia/bytes.js"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.12", default-features = false, features = ["napi4"] }
napi-derive = "2.16.12"
regex = "1.13.1"
once_cell = "1.21.4"

[build-dependencies]
napi-build = "2.1.3"
